[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.1.0"
description = "A local chat agent that automates macOS Mail, Calendar, and Reminders."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
hermes = "hermes.cli:main"
hermes-whatsapp = "hermes.whatsapp.server:main"

[tool.setuptools.packages.find]
include = ["hermes*"]
